name: Publish to crates.io

# Triggered by pushing a tag like `v0.1.0`. Uses the Nix dev shell so the
# Rust toolchain matches what the rest of CI builds with.
#
# Required secret: CARGO_REGISTRY_TOKEN
#   Generate at https://crates.io/settings/tokens with `publish-new` +
#   `publish-update` scope, then add as a repository secret.
#
# Manual run: `gh workflow run release-crates.yml --ref v0.1.0`

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify tag matches jjr Cargo.toml version
        run: |
          manifest=crates/jjr/Cargo.toml
          tag="${GITHUB_REF#refs/tags/v}"
          cargo_version=$(grep -E '^version = ' "$manifest" | head -1 | sed -E 's/version = "(.+)"/\1/')
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v${tag} does not match $manifest version ${cargo_version}" >&2
            exit 1
          fi
          echo "Tag v${tag} matches $manifest"

      - name: Wait for local-review-core on crates.io
        # `jjr` depends on `local-review-core` via path+version. cargo publish
        # requires the version to be resolvable on crates.io. When both crates
        # are bumped in the same merge their tag workflows fire in parallel;
        # this poll lets jjr's publish wait for core's publish to land.
        #
        # Polls the sparse-registry index (`index.crates.io`) rather than the
        # public API: the API returns HTTP 403 to unauthenticated runners,
        # but the sparse index is what cargo itself reads to resolve deps,
        # so a 200 here means cargo publish will resolve.
        run: |
          core_version=$(grep -E '^local-review-core' Cargo.toml | sed -E 's/.*version = "=([^"]+)".*/\1/')
          url="https://index.crates.io/lo/ca/local-review-core"
          echo "Waiting for local-review-core ${core_version} on crates.io sparse index..."
          for attempt in $(seq 1 60); do
            if curl -s --fail -H "User-Agent: ${GITHUB_REPOSITORY}-publish-poll" "$url" \
              | grep -F "\"vers\":\"${core_version}\"" >/dev/null 2>&1; then
              echo "local-review-core ${core_version} is available (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: not available yet; retrying in 15s."
            sleep 15
          done
          echo "::error::Timed out waiting for local-review-core ${core_version} on crates.io" >&2
          exit 1

      - name: Publish jjr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop --command cargo publish -p jjr
