name: Auto-tag from Cargo.toml version

# Triggered when `crates/jjr/Cargo.toml` changes on `main`. Reads the jjr
# package version, checks whether `v$version` already exists as a tag, and
# if not, creates and pushes the tag. The tag push then triggers
# `release-crates.yml` and `release-brew.yml`. Tags are jjr-specific —
# ggr is not yet published.
#
# Required secret: RELEASE_TAG_TOKEN
#   A fine-grained PAT scoped to this repo only, with `Repository permissions
#   → Contents: Read and write`. The default `GITHUB_TOKEN` cannot be used
#   here: tags pushed by `GITHUB_TOKEN` do not trigger downstream workflows
#   (GitHub's anti-recursion rule), so the release pipeline would silently
#   not run. The PAT bypasses that.
#
# Manual run: `gh workflow run auto-tag.yml --ref main`

on:
  push:
    branches: [main]
    paths:
      - "crates/jjr/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Read jjr Cargo.toml version
        id: version
        run: |
          manifest=crates/jjr/Cargo.toml
          version=$(grep -E '^version = ' "$manifest" | head -1 | sed -E 's/version = "(.+)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from $manifest" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "$manifest version: $version"

      - name: Check if tag already exists
        id: check
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag does not exist; will create."
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          tag="v${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Pushed $tag"
