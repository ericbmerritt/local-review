[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "wit-bindgen@0.51.0", reason = "two wit-bindgen versions reach us via tempfile's wasip2/wasip3 deps; cannot collapse without forking. Pinned so the skip fails when 0.51 drops out and we can re-evaluate." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
