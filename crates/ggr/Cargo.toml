[package]
name = "ggr"
version = "0.1.1"
description = "Local terminal review surface for GitHub pull requests"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["github", "review", "tui", "pr", "pull-request"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[lints]
workspace = true

[dependencies]
local-review-core.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
