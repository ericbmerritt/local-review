[package]
name = "jjr"
version = "0.1.2"
description = "Local terminal review surface for jj stacks generated by an agent"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["jj", "review", "tui", "claude", "stack"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[lints]
workspace = true

[dependencies]
local-review-core.workspace = true
blake3.workspace = true
clap.workspace = true
crossterm.workspace = true
libc.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
