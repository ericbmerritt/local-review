[package]
name = "local-review-core"
version = "0.1.0"
description = "Shared core for local-first batched code review (diff parsing, anchoring, comment storage, TUI render)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["review", "tui", "diff", "anchoring", "jj"]
categories = ["command-line-interface", "development-tools"]
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
]

[lints]
workspace = true

[features]
default = ["lang-all"]
lang-all = [
  "lang-rust",
  "lang-typescript",
  "lang-javascript",
  "lang-python",
  "lang-go",
  "lang-java",
  "lang-scala",
  "lang-kotlin",
  "lang-bash",
  "lang-yaml",
  "lang-json",
  "lang-toml",
  "lang-postgres",
  "lang-markdown",
]
lang-rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter", "dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter", "dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter", "dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter", "dep:tree-sitter-java"]
lang-scala = ["dep:tree-sitter", "dep:tree-sitter-scala"]
lang-kotlin = ["dep:tree-sitter", "dep:tree-sitter-kotlin-ng"]
lang-bash = ["dep:tree-sitter", "dep:tree-sitter-bash"]
lang-yaml = ["dep:tree-sitter", "dep:tree-sitter-yaml"]
lang-json = ["dep:tree-sitter", "dep:tree-sitter-json"]
lang-toml = ["dep:tree-sitter", "dep:tree-sitter-toml-ng"]
lang-postgres = ["dep:tree-sitter", "dep:tree-sitter-postgres"]
lang-markdown = ["dep:tree-sitter", "dep:tree-sitter-md"]

[dependencies]
snafu.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
time.workspace = true
tempfile.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-kotlin-ng = { workspace = true, optional = true }
tree-sitter-postgres = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
